name: generate-snake-animation

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: generate snake game from a github contribution grid
        uses: Platane/snk@v3
        with:
          github_user_name: sohamgodbole28
          outputs: |
            dist/snake-dark.svg?palette=github-dark
            dist/snake.svg

      - name: push snake svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
